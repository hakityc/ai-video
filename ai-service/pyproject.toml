[project]
name = "ai-video-ai-service"
version = "0.1.0"
description = "AI service for story generation and video provider orchestration."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "minio>=7.2.18",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.6",
  "pydantic>=2.11.0",
  "python-multipart>=0.0.20",
  "redis>=6.4.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
