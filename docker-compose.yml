services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_video}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_video}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2026-01-31T23-35-37Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9000/minio/health/live >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2026-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}; do sleep 1; done;
      mc mb -p local/${MINIO_BUCKET:-ai-video} || true;
      mc anonymous set public local/${MINIO_BUCKET:-ai-video} || true;
      "

  backend:
    image: golang:1.24
    working_dir: /app/backend
    env_file:
      - .env
    volumes:
      - .:/app
      - go-mod:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_started
    command: >
      sh -c "go mod download &&
      go run ./cmd/server"
    ports:
      - "${API_PORT:-8080}:8080"

  ai-service:
    image: python:3.12-slim
    working_dir: /app/ai-service
    env_file:
      - .env
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: >
      sh -c "pip install uv &&
      uv sync &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

  frontend:
    image: node:24-alpine
    working_dir: /app/frontend
    env_file:
      - .env
    volumes:
      - .:/app
      - frontend-node-modules:/app/frontend/node_modules
    depends_on:
      backend:
        condition: service_started
    command: >
      sh -c "corepack enable &&
      pnpm install &&
      pnpm dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  go-mod:
  uv-cache:
  frontend-node-modules:
