version: "2"
episode: qiao-ning-ep001
character_bible: ../characters/qiao-ning.yaml
scene_pack: ../scenes/convenience-store-night-v1.yaml
prop_pack: ../props/store-core-props-v1.yaml
shot_template: ../shot-templates/store-aisle-locked-wide-v1.yaml
provider: seedance
anchor_image: ../../assets/characters/tomb-raider-female/reference/front.jpeg
review_context: >
  Single-scene late-night convenience store micro-story. The protagonist, store layout,
  cashier counter, snack shelf, refrigerators, entrance door, and ceiling lighting must stay stable.
  Only the whitelisted anomaly changes are allowed.
master_scene_candidates: 4
shot_delta_candidates: 3
bridge_frame_selection:
  tail_ratio: 0.2
  max_candidates: 6
master_scene:
  dimensions:
    subject_motion:
      mode: open_for_text
      text: Qiao Ning stands still in the center aisle holding her phone low, listening to the quiet store
    environment_light:
      mode: locked_by_pack
      text: ""
    medium_rendering:
      mode: locked_by_pack
      text: ""
    temporal_state:
      mode: open_for_text
      text: all store props are undisturbed and the rainy exterior remains background only
    camera_optics:
      mode: locked_by_pack
      text: ""
  negative_prompt: ""
shots:
  - shot_id: shot-001
    dimensions:
      subject_motion:
        mode: open_for_text
        text: Qiao Ning lifts one hand slightly and turns her attention toward the refrigerator wall without stepping forward
      environment_light:
        mode: locked_by_pack
        text: ""
      medium_rendering:
        mode: locked_by_pack
        text: ""
      temporal_state:
        mode: open_for_text
        text: one refrigerator door light goes dark while the rest of the store remains unchanged
      camera_optics:
        mode: locked_by_pack
        text: ""
    allowed_changes:
      - hand movement
      - one refrigerator light goes dark
    forbidden_changes:
      - new props
      - protagonist position shift
    video_prompt_hint: tension rises from a small electrical anomaly
  - shot_id: shot-002
    dimensions:
      subject_motion:
        mode: open_for_text
        text: Qiao Ning stiffens in place and lowers her gaze toward the floor near the aisle center
      environment_light:
        mode: locked_by_pack
        text: ""
      medium_rendering:
        mode: locked_by_pack
        text: ""
      temporal_state:
        mode: open_for_text
        text: one dropped instant noodle cup appears near the center aisle while the store layout stays fixed
      camera_optics:
        mode: locked_by_pack
        text: ""
    allowed_changes:
      - facial expression shift
      - one dropped cup appears on the floor
    forbidden_changes:
      - shelf change
      - new people
    video_prompt_hint: unease turns into visible anomaly
  - shot_id: shot-003
    dimensions:
      subject_motion:
        mode: open_for_text
        text: Qiao Ning keeps her body mark stable and looks toward the entrance glass in restrained fear
      environment_light:
        mode: locked_by_pack
        text: ""
      medium_rendering:
        mode: locked_by_pack
        text: ""
      temporal_state:
        mode: open_for_text
        text: one wet footprint trail appears from the entrance toward the aisle while all fixed store props remain in place
      camera_optics:
        mode: locked_by_pack
        text: ""
    allowed_changes:
      - gaze shift toward entrance
      - wet footprint trail appears
    forbidden_changes:
      - new customers
      - door relocation
    video_prompt_hint: fear sharpens into a supernatural clue
