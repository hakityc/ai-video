version: "2"
episode: tomb-raider-female-ep007
character_bible: ../characters/tomb-raider-female.yaml
scene_pack: ../scenes/morgue-night-v2.yaml
prop_pack: ../props/morgue-core-props-v2.yaml
shot_template: ../shot-templates/morgue-locked-wide-v2.yaml
provider: seedance
anchor_image: ../../assets/characters/tomb-raider-female/reference/front.jpeg
review_context: >
  Single-scene morgue micro-story. The protagonist, room layout, lighting rig, corpse table,
  trolley, and right counter must stay stable. Only shot-specific motion and temporal state changes
  are allowed.
master_scene_candidates: 4
shot_delta_candidates: 3
bridge_frame_selection:
  tail_ratio: 0.2
  max_candidates: 6
master_scene:
  dimensions:
    subject_motion:
      mode: open_for_text
      text: Lin Xia stands still beside the centered corpse table in calm forensic posture
    environment_light:
      mode: locked_by_pack
      text: ""
    medium_rendering:
      mode: locked_by_pack
      text: ""
    temporal_state:
      mode: open_for_text
      text: corpse under white sheet with only the face exposed, room in pre-incident stillness
    camera_optics:
      mode: locked_by_pack
      text: ""
  negative_prompt: ""
shots:
  - shot_id: shot-001
    dimensions:
      subject_motion:
        mode: open_for_text
        text: Lin Xia lowers her bare hands toward the corpse table in cautious inspection posture
      environment_light:
        mode: locked_by_pack
        text: ""
      medium_rendering:
        mode: locked_by_pack
        text: ""
      temporal_state:
        mode: open_for_text
        text: corpse remains still under the same white sheet
      camera_optics:
        mode: locked_by_pack
        text: ""
    allowed_changes:
      - protagonist hand movement only
    forbidden_changes:
      - new props
    video_prompt_hint: restrained calm before dread
  - shot_id: shot-002
    dimensions:
      subject_motion:
        mode: open_for_text
        text: Lin Xia recoils half a step in restrained shock while staying on her floor mark
      environment_light:
        mode: locked_by_pack
        text: ""
      medium_rendering:
        mode: locked_by_pack
        text: ""
      temporal_state:
        mode: open_for_text
        text: corpse eyes open while sheet coverage and table position stay fixed
      camera_optics:
        mode: locked_by_pack
        text: ""
    allowed_changes:
      - corpse eyes open
      - restrained recoil
    forbidden_changes:
      - body pose change
      - sheet coverage change
    video_prompt_hint: silent supernatural anomaly
  - shot_id: shot-003
    dimensions:
      subject_motion:
        mode: open_for_text
        text: Lin Xia turns her attention toward the right counter while keeping her body mark stable
      environment_light:
        mode: locked_by_pack
        text: ""
      medium_rendering:
        mode: locked_by_pack
        text: ""
      temporal_state:
        mode: open_for_text
        text: one autopsy report and one compact recorder appear on the right counter while the corpse returns to the neutral covered state
      camera_optics:
        mode: locked_by_pack
        text: ""
    allowed_changes:
      - report appears on right counter
      - recorder appears on right counter
    forbidden_changes:
      - report on corpse table
    video_prompt_hint: dread turns into investigation
