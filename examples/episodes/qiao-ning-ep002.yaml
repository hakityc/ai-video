shot_template: ../shot-templates/store-aisle-locked-wide-v1.yaml
provider: seedance
anchor_image: ../../assets/characters/tomb-raider-female/reference/front.jpeg
review_context: >
  Single-scene late-night convenience store micro-story. The protagonist, store layout,
  cashier counter, snack shelf, refrigerators, entrance door, and ceiling lighting must stay stable.
  The story must progress in six linked beats without adding new people or moving the camera.
master_scene_candidates: 3
shot_delta_candidates: 2
bridge_frame_selection:
  tail_ratio: 0.2
  max_candidates: 6
master_scene:
  dimensions:
    subject_motion:
      mode: open_for_text
      text: Qiao Ning stands still in the center aisle holding her phone low, listening to the quiet store
    environment_light:
      mode: locked_by_pack
      text: ""
    medium_rendering:
      mode: locked_by_pack
      text: ""
    temporal_state:
      mode: open_for_text
      text: all store props are undisturbed and the rainy exterior remains background only
    camera_optics:
      mode: locked_by_pack
      text: ""
  negative_prompt: ""
shots:
  - shot_id: shot-001
    dimensions:
      subject_motion:
        mode: open_for_text
        text: Qiao Ning lifts one hand slightly and turns her attention toward the refrigerator wall without stepping forward
      environment_light:
        mode: locked_by_pack
        text: ""
      medium_rendering:
        mode: locked_by_pack
        text: ""
      temporal_state:
        mode: open_for_text
        text: one refrigerator door light goes dark while the rest of the store remains unchanged
      camera_optics:
        mode: locked_by_pack
        text: ""
    allowed_changes:
      - hand movement
      - one refrigerator light goes dark
    forbidden_changes:
      - new props
      - protagonist position shift
    video_prompt_hint: tension rises from a small electrical anomaly
