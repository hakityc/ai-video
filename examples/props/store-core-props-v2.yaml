version: "2"
id: store-core-props-v2
name: Store Core Props V2
scene_pack: ../scenes/convenience-store-night-v1.yaml
fixed_props:
  - half-open cashier till
  - paper receipt roll near the till
  - hanging convenience store sign strip above the aisle
  - closed umbrella stand near the glass entrance
  - stacked drink crates below the refrigerator doors
allowed_temporal_changes:
  - one refrigerator door light goes dark while the layout stays fixed
  - the same refrigerator light stays dark across following shots
  - one dropped instant noodle cup appears near the center aisle
  - one wet footprint trail appears from the entrance toward the aisle
  - one printed receipt strip extends from the cashier till and hangs over the counter edge
  - cashier till display glows on without the counter layout changing
forbidden_drift:
  - cashier counter replaced
  - snack shelf shape changes
  - umbrella stand removed
  - random new branded props
  - refrigerator door opens
