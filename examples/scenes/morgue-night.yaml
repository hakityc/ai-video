version: "1"
id: morgue-night
name: Municipal Morgue Night
type: fixed_interior
visual_role: primary_scene_pack
anchors:
  layout:
    - rectangular municipal morgue room
    - corpse table centered toward camera
    - tray trolley fixed on left side
    - stainless counter fixed on right side
    - grey lockers along back-left wall
    - single door on rear-right wall
  lighting:
    - two white surgical lamps overhead
    - cold blue-green clinical ambient light
    - no warm practical lights
    - no neon or daylight spill
  palette:
    - blue-green walls
    - desaturated steel grey surfaces
    - white sheet and white light fixtures
  continuity_rules:
    - keep same room geometry across all shots in this chapter
    - keep same surgical lamp count and approximate placement
    - keep tray trolley and right counter in frame for locked wide shots
    - do not replace lockers, door, or wall equipment with new furniture
allowed_camera_templates:
  - morgue_locked_wide
  - morgue_medium_right
forbidden_drift:
  - extra windows
  - different room color
  - different number of surgical lamps
  - corridor or operating theater swap
