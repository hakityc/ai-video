version: '1'
id: tomb-raider-female-shot-001
character_bible: ../characters/tomb-raider-female.yaml
provider: comfyui
scene_prompt: medium shot in a municipal morgue, cold autopsy lights reflecting off
  stainless steel tables, unidentified female corpse on the table starting to open
  its eyes, Lin Xia in brown leather jacket over grey hoodie with a white forensic
  coat and nitrile gloves, restrained fear, grounded modern Chinese supernatural
  thriller atmosphere
negative_prompt: ''
seed: 42
fps: 16
num_frames: 81
output_prefix: tomb-raider-female-shot-001
input_image:
  source: ../../assets/characters/tomb-raider-female/reference/front.jpeg
  source_type: local_path
  upload_to_comfyui: true
comfyui:
  workflow_path: ../workflows/comfyui_i2v_template.json
  output_dir: ../../artifacts/video/comfyui/tomb-raider-female
  poll_interval_seconds: 5
  timeout_seconds: 1800
  download_outputs: true
  workflow_overrides:
  - node_id: '10'
    input_name: image
    value: ${input_image_name}
  - node_id: '20'
    input_name: text
    value: ${prompt}
  - node_id: '21'
    input_name: text
    value: ${negative_prompt}
  - node_id: '30'
    input_name: seed
    value: ${seed}
  - node_id: '30'
    input_name: steps
    value: 30
  - node_id: '30'
    input_name: cfg
    value: 6
  - node_id: '50'
    input_name: filename_prefix
    value: ${output_prefix}
