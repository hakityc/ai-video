version: "1"
id: shot-001
character_bible: ../characters/protagonist.yaml
provider: comfyui
scene_prompt: medium close-up, standing on a rainy neon street at night, subtle head turn, cinematic camera drift
negative_prompt: jitter, ugly hands, warped face
seed: 12345
fps: 16
num_frames: 81
output_prefix: shot-001
input_image:
  source: ../../assets/characters/lin-xiaoyu/reference/front.png
  source_type: local_path
  upload_to_comfyui: true
comfyui:
  workflow_path: ../workflows/comfyui_i2v_template.json
  output_dir: ../../artifacts/video/comfyui/lin-xiaoyu
  poll_interval_seconds: 5
  timeout_seconds: 1800
  download_outputs: true
  workflow_overrides:
    - node_id: "10"
      input_name: image
      value: "${input_image_name}"
    - node_id: "20"
      input_name: text
      value: "${prompt}"
    - node_id: "21"
      input_name: text
      value: "${negative_prompt}"
    - node_id: "30"
      input_name: seed
      value: "${seed}"
    - node_id: "30"
      input_name: steps
      value: 30
    - node_id: "30"
      input_name: cfg
      value: 6
    - node_id: "50"
      input_name: filename_prefix
      value: "${output_prefix}"
