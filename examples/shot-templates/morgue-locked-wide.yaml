version: "1"
id: morgue_locked_wide
name: Morgue Locked Wide
scene_pack: ../scenes/morgue-night.yaml
shot_type: locked_wide
lens_intent: 28-35mm equivalent
framing:
  - corpse table centered toward camera
  - protagonist on right third of frame
  - tray trolley on left edge
  - right counter on right edge
  - two surgical lamps visible overhead
blocking_rules:
  - protagonist keeps roughly same standing mark across sequence
  - no walking across frame in keyframe stage
  - corpse remains on same table mark
allowed_changes:
  - protagonist expression
  - protagonist hand position
  - corpse eye state
  - presence of one story-state prop on right counter
forbidden_changes:
  - camera angle changes
  - protagonist side swap
  - prop relocation
  - room geometry changes
prompt_suffix:
  - locked-off frontal wide shot
  - exact same camera angle across sequence
  - no camera drift
  - no room layout drift
