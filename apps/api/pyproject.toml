[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-video-control-plane"
version = "0.1.0"
description = "Control-plane scaffold for AI video generation, QA, and repair loops."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
  "Pillow>=10.3,<11",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
  "rich>=13.7,<14",
  "typer>=0.12,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
video = [
  "accelerate>=1.4,<2",
  "diffusers>=0.35,<1",
  "Pillow>=10.3,<11",
  "torch>=2.6,<3",
  "transformers>=4.49,<5",
]
workflow = [
  "prefect>=3.4,<4",
]
qa = [
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
  "insightface>=0.7.3,<1",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "Pillow>=10.3,<11",
]

[project.scripts]
aivideo = "ai_video_control.cli:app"
aivideo-web = "ai_video_control.webapp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_video_control"]
